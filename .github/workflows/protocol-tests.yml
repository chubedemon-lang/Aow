  combat-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile synthetic combat rules
        run: python -m py_compile server/combat.py
      - name: Canonical combat turn-state tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_combat.py' -v

  sqlite-domain-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only SQLite domain audit
        run: python -m py_compile tools/sqlite_domain_audit.py
      - name: Read-only domain audit regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_domain_audit.py' -v

  aarch64-eh-frame-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile offline AArch64 FDE index
        run: python -m py_compile tools/aarch64_eh_frame_index.py
      - name: AArch64 FDE index tests (synthetic headers only)
        run: python -m unittest discover -s tests -p 'test_aarch64_eh_frame_index.py' -v
