        run: python -m py_compile server/sqlite_authorized_world_state_service.py
      - name: Atomic session/world-state integration tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_authorized_world_state_service.py' -v

  character-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile shared character snapshot decoder and authorized readers
        run: python -m py_compile server/character_snapshot.py server/sqlite_authorized_character_service.py server/sqlite_authorized_world_state_service.py server/sqlite_authorized_player_bootstrap_service.py
      - name: Strict persisted character snapshot tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_character_snapshot_validation.py' -v

  authorized-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
