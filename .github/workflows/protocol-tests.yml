      - 'tests/test_sqlite_authorized_map_position_service.py'
      - 'docs/AUTHORIZED_MAP_POSITION_SERVICE.md'
      - 'server/character_snapshot.py'
      - 'server/sqlite_authorized_character_service.py'
      - 'server/sqlite_authorized_world_state_service.py'
      - 'tests/test_sqlite_authorized_world_state_service.py'
      - 'docs/WORLD_STATE_READS.md'
      - 'server/sqlite_authorized_player_bootstrap_service.py'
      - 'tests/test_character_snapshot_validation.py'
      - 'docs/CHARACTER_LIFECYCLE.md'
