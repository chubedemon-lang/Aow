      - 'tests/test_sqlite_shop_store.py'
      - 'docs/SQLITE_SHOP_STORE.md'
      - 'tests/test_sqlite_authorized_combat_service.py'
      - 'docs/COMBAT_PERSISTENCE.md'
      - 'server/sqlite_authorized_transaction.py'
      - 'tests/test_sqlite_authorized_player_state_service.py'
      - 'docs/AUTHORIZED_PLAYER_STATE_SERVICE.md'
      - 'docs/IL2CPP_PROTOCOL_IDENTIFIER_INVENTORY.md'
      - '.github/workflows/protocol-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AArch64 small argument evidence tests (synthetic code only)
        run: python -m unittest discover -s tests -p 'test_aarch64_call_argument_evidence.py' -v
      - name: AArch64 delegate method-pointer tests (synthetic code only)
        run: python -m unittest discover -s tests -p 'test_aarch64_delegate_target_evidence.py' -v
      - name: Compile offline analysis and evidence tools
        run: |
          python -m py_compile \
            tools/protocol_candidates.py \
            tools/il2cpp_metadata_inventory.py \
            tools/il2cpp_type_inventory.py \
            tools/il2cpp_native_method_evidence.py \
            tools/il2cpp_network_callsite_evidence.py \
            tools/il2cpp_metadata_usage_evidence.py \
            tools/aarch64_call_argument_evidence.py \
            tools/aarch64_delegate_target_evidence.py \
            tools/aarch64_eh_frame_index.py \
            server/aow_primitive_codec.py \
            server/frame_reader.py \
            server/stream_reader.py \
            server/stream_buffer.py \
            server/stream_writer.py \
            server/aow_framing_candidate.py \
            server/offline_frame_probe.py \
            server/offline_protocol_evidence.py \
            server/offline_packet_fixture.py \
            server/offline_fixture_batch.py \
            server/offline_evidence_validation.py \
            server/transport.py \
            server/protocol_evidence_registry.py \
            server/protocol_evidence_gates.py \
            server/evidence_ledger.py
      - name: Protocol candidate scanner tests (synthetic input only)
        run: python -m unittest discover -s tests -p 'test_protocol_candidates.py' -v
      - name: IL2CPP metadata inventory tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_metadata_inventory.py' -v
      - name: IL2CPP type inventory tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_type_inventory.py' -v
      - name: Native method entry-point evidence tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_native_method_evidence.py' -v
      - name: Native network callsite evidence tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_network_callsite_evidence.py' -v
      - name: IL2CPP metadata usage evidence tests (synthetic tokens only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_metadata_usage_evidence.py' -v
      - name: AOW primitive codec tests (synthetic vectors only)
        run: python -m unittest discover -s tests -p 'test_aow_primitive_codec.py' -v
      - name: Synthetic frame decoder tests (fabricated streams only)
        run: python -m unittest discover -s tests -p 'test_offline_frame_probe.py' -v
      - name: Generic frame and blocking stream reader tests (synthetic format only)
        run: |
          python -m unittest discover -s tests -p 'test_frame_reader.py' -v
          python -m unittest discover -s tests -p 'test_stream_reader.py' -v
      - name: Generic bounded stream I/O tests (synthetic bytes only)
        run: |
          python -m py_compile server/stream_buffer.py server/stream_writer.py
          python -m unittest discover -s tests -p 'test_stream_buffer.py' -v
          python -m unittest discover -s tests -p 'test_stream_writer.py' -v
      - name: Isolated AOW receive-length candidate tests (synthetic stream only)
        run: python -m unittest discover -s tests -p 'test_aow_framing_candidate.py' -v
      - name: Transport evidence boundary tests (synthetic codec only)
        run: python -m unittest discover -s tests -p 'test_transport.py' -v
      - name: Protocol evidence registry tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_protocol_evidence_registry.py' -v
      - name: Ordered protocol evidence gate tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_protocol_evidence_gates.py' -v
      - name: End-to-end evidence ledger tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_evidence_ledger.py' -v
      - name: Offline protocol evidence manifest tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_offline_protocol_evidence.py' -v
      - name: Offline packet fixture tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_packet_fixture.py' -v
      - name: Offline fixture batch tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_fixture_batch.py' -v
      - name: Offline fixture privacy boundary tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_fixture_privacy_boundaries.py' -v
      - name: Offline evidence validation tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_offline_evidence_validation.py' -v
  socket-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile connected socket channel
        run: python -m py_compile server/socket_channel.py
      - name: Connected socket channel tests (local socket pairs only)
        run: python -m unittest discover -s tests -p 'test_socket_channel.py' -v

  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile synthetic authentication modules
        run: python -m py_compile server/sqlite_account_auth_service.py server/sqlite_auth_rate_limiter.py
      - name: Synthetic authentication input security tests
        run: |
          python -m unittest discover -s tests -p 'test_sqlite_account_auth_service.py' -v
          python -m unittest discover -s tests -p 'test_sqlite_auth_rate_limiter.py' -v
          python -m unittest discover -s tests -p 'test_sqlite_account_auth_rate_limiter.py' -v
  session-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable session store
        run: python -m py_compile server/sqlite_session_store.py
      - name: Durable session store regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_session_store.py' -v
  reward-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable reward ledgers
        run: python -m py_compile server/sqlite_reward_ledger.py server/quest_award_ledger.py
      - name: Durable reward ledger integrity tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_reward_ledger.py' -v
      - name: Quest award ledger regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_quest_award_ledger.py' -v
  player-state-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable player state store
        run: python -m py_compile server/sqlite_player_state_store.py
      - name: Durable player state integrity tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_player_state_store.py' -v
  map-position-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable map-position store
        run: python -m py_compile server/sqlite_map_position_store.py
      - name: Durable map-position integrity tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_map_position_store.py' -v
  inventory-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable inventory store
        run: python -m py_compile server/sqlite_inventory_store.py
      - name: Durable inventory persistence regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_inventory_store.py' -v

  shop-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable shop store and authorization facade
        run: python -m py_compile server/sqlite_shop_store.py server/sqlite_authorized_shop_service.py
      - name: Durable shop persistence regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_shop_store.py' -v
      - name: Session-authorized shop integration tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_authorized_shop_service.py' -v

  authorized-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
