name: Protocol discovery tests
on:
  push:
    branches: [main, server-protocol-discovery-tooling]
  pull_request:
    paths:
      - 'tools/protocol_candidates.py'
      - 'tests/test_protocol_candidates.py'
      - 'tools/il2cpp_metadata_inventory.py'
      - 'tests/test_il2cpp_metadata_inventory.py'
      - 'tools/il2cpp_type_inventory.py'
      - 'tests/test_il2cpp_type_inventory.py'
      - 'tools/il2cpp_native_method_evidence.py'
      - 'tests/test_il2cpp_native_method_evidence.py'
      - 'tools/il2cpp_network_callsite_evidence.py'
      - 'tools/aarch64_call_argument_evidence.py'
      - 'tests/test_aarch64_call_argument_evidence.py'
      - 'tools/aarch64_delegate_target_evidence.py'
      - 'tests/test_aarch64_delegate_target_evidence.py'
      - 'docs/AARCH64_DELEGATE_TARGET_EVIDENCE.md'
      - 'tests/test_il2cpp_network_callsite_evidence.py'
      - 'docs/IL2CPP_NATIVE_METHOD_EVIDENCE.md'
      - 'docs/NATIVE_NETWORK_CALLSITE_EVIDENCE.md'
      - 'server/aow_primitive_codec.py'
      - 'tests/test_aow_primitive_codec.py'
      - 'docs/AOW_PRIMITIVE_SERIALIZATION.md'
      - 'server/offline_frame_probe.py'
      - 'tests/test_offline_frame_probe.py'
      - 'docs/OFFLINE_FRAME_PROBE.md'
      - 'server/transport.py'
      - 'tests/test_transport.py'
      - 'server/protocol_evidence_registry.py'
      - 'tests/test_protocol_evidence_registry.py'
      - 'server/protocol_evidence_gates.py'
      - 'tests/test_protocol_evidence_gates.py'
      - 'server/evidence_ledger.py'
      - 'tests/test_evidence_ledger.py'
      - 'server/offline_protocol_evidence.py'
      - 'tests/test_offline_protocol_evidence.py'
      - 'server/offline_packet_fixture.py'
      - 'tests/test_offline_packet_fixture.py'
      - 'server/offline_fixture_batch.py'
      - 'tests/test_offline_fixture_batch.py'
      - 'tests/test_offline_fixture_privacy_boundaries.py'
      - 'docs/OFFLINE_PACKET_FIXTURE_VALIDATION.md'
      - 'server/offline_evidence_validation.py'
      - 'tests/test_offline_evidence_validation.py'
      - 'docs/TRANSPORT_EVIDENCE_GATE.md'
      - 'docs/PROTOCOL.md'
      - 'server/sqlite_reward_ledger.py'
      - 'server/quest_award_ledger.py'
      - 'tests/test_sqlite_reward_ledger.py'
      - 'tests/test_quest_award_ledger.py'
      - 'docs/SQLITE_REWARD_LEDGER.md'
      - 'server/sqlite_session_store.py'
      - 'tests/test_sqlite_session_store.py'
      - 'docs/SQLITE_SESSION_STORE.md'
      - 'docs/IL2CPP_PROTOCOL_IDENTIFIER_INVENTORY.md'
      - '.github/workflows/protocol-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AArch64 small argument evidence tests (synthetic code only)
        run: python -m unittest discover -s tests -p 'test_aarch64_call_argument_evidence.py' -v
      - name: AArch64 delegate method-pointer tests (synthetic code only)
        run: python -m unittest discover -s tests -p 'test_aarch64_delegate_target_evidence.py' -v
      - name: Compile offline analysis and evidence tools
        run: |
          python -m py_compile \
            tools/protocol_candidates.py \
            tools/il2cpp_metadata_inventory.py \
            tools/il2cpp_type_inventory.py \
            tools/il2cpp_native_method_evidence.py \
            tools/il2cpp_network_callsite_evidence.py \
            tools/aarch64_call_argument_evidence.py \
            tools/aarch64_delegate_target_evidence.py \
            server/aow_primitive_codec.py \
            server/offline_frame_probe.py \
            server/offline_protocol_evidence.py \
            server/offline_packet_fixture.py \
            server/offline_fixture_batch.py \
            server/offline_evidence_validation.py \
            server/transport.py \
            server/protocol_evidence_registry.py \
            server/protocol_evidence_gates.py \
            server/evidence_ledger.py
      - name: Protocol candidate scanner tests (synthetic input only)
        run: python -m unittest discover -s tests -p 'test_protocol_candidates.py' -v
      - name: IL2CPP metadata inventory tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_metadata_inventory.py' -v
      - name: IL2CPP type inventory tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_type_inventory.py' -v
      - name: Native method entry-point evidence tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_native_method_evidence.py' -v
      - name: Native network callsite evidence tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -p 'test_il2cpp_network_callsite_evidence.py' -v
      - name: AOW primitive codec tests (synthetic vectors only)
        run: python -m unittest discover -s tests -p 'test_aow_primitive_codec.py' -v
      - name: Synthetic frame decoder tests (fabricated streams only)
        run: python -m unittest discover -s tests -p 'test_offline_frame_probe.py' -v
      - name: Transport evidence boundary tests (synthetic codec only)
        run: python -m unittest discover -s tests -p 'test_transport.py' -v
      - name: Protocol evidence registry tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_protocol_evidence_registry.py' -v
      - name: Ordered protocol evidence gate tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_protocol_evidence_gates.py' -v
      - name: End-to-end evidence ledger tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_evidence_ledger.py' -v
      - name: Offline protocol evidence manifest tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_offline_protocol_evidence.py' -v
      - name: Offline packet fixture tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_packet_fixture.py' -v
      - name: Offline fixture batch tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_fixture_batch.py' -v
      - name: Offline fixture privacy boundary tests (synthetic bytes only)
        run: python -m unittest discover -s tests -p 'test_offline_fixture_privacy_boundaries.py' -v
      - name: Offline evidence validation tests (metadata only)
        run: python -m unittest discover -s tests -p 'test_offline_evidence_validation.py' -v
  session-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile durable session store
        run: python -m py_compile server/sqlite_session_store.py
      - name: Durable session store regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_session_store.py' -v
  reward-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Compile durable reward ledgers
        run: python -m py_compile server/sqlite_reward_ledger.py server/quest_award_ledger.py
      - name: Durable reward ledger integrity tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_sqlite_reward_ledger.py' -v
      - name: Quest award ledger regression tests (synthetic only)
        run: python -m unittest discover -s tests -p 'test_quest_award_ledger.py' -v
